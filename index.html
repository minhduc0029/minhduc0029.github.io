<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365 Transport - Vận Tải 365</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a2942; /* Xanh đen giống sidebar TMS */
            --secondary-color: #0d6efd; /* Xanh dương nổi bật */
            --text-color: #333;
            --bg-color: #f4f6f9; /* Nền xám nhạt */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Phần Banner phía trên cùng */
        .hero-banner {
            width: 100%;
            height: 250px;
            background-image: url('banner365.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Lớp phủ mờ cho banner để nổi bật logo nếu cần */
        .hero-banner::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(26, 41, 66, 0.4);
        }

        .container {
            background-color: #ffffff;
            width: 90%;
            max-width: 800px;
            margin-top: -60px; /* Kéo khung nội dung đè lên banner một chút */
            position: relative;
            z-index: 10;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: -80px; /* Đẩy logo nhô lên khỏi khung */
            background-color: #fff;
            object-fit: contain;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.2em;
            margin: 15px 0 5px 0;
            text-transform: uppercase;
        }

        .slogan {
            color: var(--secondary-color);
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .contact-info {
            text-align: left;
            background-color: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            margin-bottom: 35px;
        }

        .contact-info p {
            margin: 12px 0;
            font-size: 1.05em;
            display: flex;
            align-items: flex-start;
        }

        .contact-info i {
            color: var(--secondary-color);
            width: 30px;
            font-size: 1.2em;
            margin-top: 3px;
        }

        .contact-info a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-info a:hover {
            color: var(--secondary-color);
        }

        /* Nút bấm Hệ thống */
        .system-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            min-width: 250px;
        }

        .btn i {
            margin-right: 10px;
            font-size: 1.2em;
        }

        .btn-primary {
            background-color: var(--secondary-color);
            color: #fff;
            box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
            transform: translateY(-3px);
        }

        .btn-disabled {
            background-color: #e9ecef;
            color: #6c757d;
            border: 1px dashed #adb5bd;
            cursor: not-allowed;
        }

        .btn-disabled:hover {
            background-color: #f8f9fa;
        }

        .footer {
            margin-top: 40px;
            padding-bottom: 20px;
            color: #6c757d;
            font-size: 0.9em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 25px 15px;
            }
            .system-actions {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="hero-banner"></div>

    <div class="container">
        <img src="logo365.jpg" alt="Logo Vận Tải 365" class="logo">
        
        <h1>Vận Tải 365</h1>
        <p class="slogan">CUNG CẤP GIẢI PHÁP LOGISTICS TOÀN QUỐC</p>

        <div class="contact-info">
            <p><i class="fas fa-map-marker-alt"></i> <span>547A Đường lộ Hậu Tân Thạnh Tây, KV3, Ba Láng, Q. Cái Răng, TP. Cần Thơ, Vietnam</span></p>
            <p><i class="fas fa-phone-alt"></i> <span><a href="tel:0354900707">035 490 0707</a></span></p>
            <p><i class="fas fa-envelope"></i> <span><a href="mailto:vantai365ngaydem@gmail.com">vantai365ngaydem@gmail.com</a></span></p>
        </div>

        <h3 style="color: var(--primary-color); margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; display: inline-block;">HỆ THỐNG QUẢN TRỊ NỘI BỘ</h3>
        
        <div class="system-actions">
            <!-- Nút vào hệ thống TMS -->
            <a href="https://tms.365transport.vn" class="btn btn-primary">
                <i class="fas fa-truck-fast"></i> Quản Lý Điều Phối
            </a>
            
            <!-- Nút Kho vật tư đã được cập nhật link -->
            <a href="https://365transport.vn/kho365/" class="btn btn-primary">
                <i class="fas fa-boxes-stacked"></i> Quản Lý Kho Vật Tư
            </a>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 365 Transport. Cung cấp bởi hệ thống nội bộ.
    </div>

</body>
</html>
